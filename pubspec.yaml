name: pdf_super_app

description: "A modern PDF Super App built with Flutter."

publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0

  # UI / Fonts
  google_fonts: ^8.2.1

  # File Selection & File Handling
  file_picker: ^12.1.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0

  # PDF
  syncfusion_flutter_pdf: ^34.2.5
  syncfusion_flutter_pdfviewer: ^34.2.5
  pdf: ^3.11.3
  printing: ^5.14.2
  syncfusion_flutter_signaturepad: ^34.2.5
  flutter_svg: ^2.3.0

  # Images / Camera
  image_picker: ^1.2.1
  image: ^4.5.4
  camera: ^0.11.2

  # OCR
  google_mlkit_text_recognition: ^0.17.1

  # Sharing
  share_plus: ^13.0.0

  # Local Storage
  shared_preferences: ^2.5.3

  # PDF Rendering
  pdfx: ^2.11.0

  # API
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon
  flutter_launcher_icons: ^0.14.4

  # Native Splash
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

# ============================================================
# NATIVE SPLASH SCREEN
# ============================================================

flutter_native_splash:
  color: "#F4F8FF"

  image: assets/images/app_icon.png
  android_gravity: center
  ios_content_mode: center

  fullscreen: true

  android_12:
    color: "#F4F8FF"
    image: assets/images/app_icon.png
    icon_background_color: "#F4F8FF"